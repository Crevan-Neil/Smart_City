name: AI Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "ai_service/**"
      - ".github/workflows/ai-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai_service/**"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smart-city-ai-service
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Lint + Test ──────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        working-directory: ai_service
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Ruff linter
        working-directory: ai_service
        run: |
          pip install ruff
          ruff check . --select E,W,F --ignore E501

      - name: Run tests (with mocked LLM)
        working-directory: ai_service
        env:
          MONGO_URI: mongodb://admin:testpass@localhost:27017/smart_city_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          # Use a fake key — LLM calls are mocked in tests
          LLM_API_KEY: test-key-mocked
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-1.5-flash
          ALLOWED_ORIGINS: '["http://localhost:5173"]'
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests directory found — skipping"

  # ── Job 2: Build & Push Docker image ────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max