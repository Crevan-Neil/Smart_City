name: Backend CI

# ─────────────────────────────────────────────
#  Triggers:
#    - Push to main/develop that touches backend/
#      or shared models/
#    - Any PR targeting main
# ─────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "models/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "models/**"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smart-city-backend
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Lint + Test ──────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      # Spin up a real MongoDB for integration tests
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Spin up a real Redis for rate limiter tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3001
          MONGO_URI: mongodb://admin:testpass@localhost:27017/smart_city_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          REDIS_CHANNEL: city:live
          JWT_SECRET: test-secret-do-not-use-in-prod
          CLIENT_ORIGIN: http://localhost:5173
          # Stub InfluxDB — not needed for unit tests
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: test-token
          INFLUX_ORG: test-org
          INFLUX_BUCKET: test-bucket
        run: npm test --if-present

      - name: Check for secrets accidentally committed
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ── Job 2: Build & Push Docker image ────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    # Only push image on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds — speeds up CI significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Image pushed — ${{ steps.meta.outputs.tags }}"