name: Deploy to Azure VM

on:
  workflow_dispatch: # Allow manual trigger
  workflow_run:
    workflows:
      - "Backend CI"
      - "Simulation CI"
      - "AI Service CI"
      - "Frontend CI" # Now waits for the frontend too!
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: SSH Deploy to Azure VM
    runs-on: ubuntu-latest
    # Only run if all previous CIs succeeded or if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key:      ${{ secrets.AZURE_VM_SSH_KEY }}
          timeout:  300s
          script: |
            set -euo pipefail

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Smart City — Azure VM Deploy"
            echo "  $(date -u)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Fix: Using correct case-sensitive folder
            cd ~/Smart_City

            # 1. Update the code and Nginx configs
            git fetch origin
            git reset --hard origin/main

            # 2. Log into GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull latest images
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull

            # 4. Restart everything (Remove orphans ensures clean state)
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            # 5. Cleanup
            docker image prune -f
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✓ Services Restarted Successfully"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Verify Frontend Health
        run: |
          echo "Polling http://${{ secrets.AZURE_VM_HOST }}..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.AZURE_VM_HOST }}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Frontend is live!"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS (waiting...)"
            sleep 10
          done
          echo "✗ Frontend check failed"
          exit 1