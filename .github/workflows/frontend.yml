name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "staticwebapp.config.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "staticwebapp.config.json"

env:
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Lint + Build ─────────────────────
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type check (if TypeScript)
        working-directory: frontend
        run: npm run type-check --if-present

      - name: Build production bundle
        working-directory: frontend
        # VITE_API_URL points to the Azure VM public IP / domain.
        # Replace the placeholder with your real VM IP after provisioning.
        env:
          VITE_API_URL: ${{ secrets.AZURE_VM_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.AZURE_VM_API_URL }}
          VITE_AI_URL: ${{ secrets.AZURE_VM_API_URL }}
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          du -sh dist/
          echo "Build successful ✓"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Job 2: Deploy to Azure Static Web Apps ──
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Root of the repo (staticwebapp.config.json is here)
          app_location: "frontend"
          # Vite outputs to dist/
          output_location: "dist"
          # No separate API — skip Azure Functions
          skip_api_build: true