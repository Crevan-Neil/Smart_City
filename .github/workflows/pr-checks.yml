name: PR Quality Checks

# ─────────────────────────────────────────────
#  Runs on every pull request to enforce:
#    - Conventional commit message format
#    - PR size limits (encourages small PRs)
#    - Auto-labeling by changed files
# ─────────────────────────────────────────────

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # ── Conventional commit check ─────────────────
  commit-lint:
    name: Commit Message Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js

  # ── PR size check ─────────────────────────────
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count changed lines
        id: diff
        run: |
          LINES=$(git diff --stat \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            | tail -1 \
            | grep -oP '\d+ insertion' \
            | grep -oP '\d+' || echo "0")
          echo "lines=$LINES" >> $GITHUB_OUTPUT
          echo "Changed lines: $LINES"

      - name: Warn on large PR
        if: steps.diff.outputs.lines > 500
        run: |
          echo "⚠️  This PR changes ${{ steps.diff.outputs.lines }} lines."
          echo "Consider splitting into smaller PRs for easier review."
          echo "Recommended: < 500 lines per PR"
          # Warning only — does not fail the build

  # ── Auto-label by changed paths ───────────────
  labeler:
    name: Auto Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply labels based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  # ── PR description check ──────────────────────
  pr-description:
    name: PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Check PR has a description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body;
            if (!body || body.trim().length < 20) {
              core.setFailed(
                'PR description is too short. Please describe what this PR does and why.'
              );
            } else {
              console.log('PR description looks good ✓');
            }