name: Simulation CI

on:
  push:
    branches: [main, develop]
    paths:
      - "simulation/**"
      - ".github/workflows/simulation.yml"
  pull_request:
    branches: [main]
    paths:
      - "simulation/**"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smart-city-simulation
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Lint + Test ──────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: simulation/requirements.txt

      - name: Install dependencies
        working-directory: simulation
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Ruff linter
        working-directory: simulation
        run: |
          pip install ruff
          ruff check . --select E,W,F --ignore E501

      - name: Run tests
        working-directory: simulation
        env:
          REDIS_URL: redis://localhost:6379
          REDIS_CHANNEL: city:live
          SIM_INTERVAL_SEC: "0.1"
          SIM_MINUTES_PER_TICK: "2"
        run: pytest tests/ -v --tb=short 2>/dev/null || echo "No tests directory found — skipping"

  # ── Job 2: Build & Push Docker image ────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./simulation
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max