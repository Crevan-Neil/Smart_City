# ─────────────────────────────────────────────
#  docker-compose.prod.yml
#  PRODUCTION override for Azure B1s VM.
#
#  Usage on the VM:
#    docker compose -f docker-compose.prod.yml up -d
#    docker compose -f docker-compose.prod.yml pull && \
#    docker compose -f docker-compose.prod.yml up -d
#
#  Key differences from docker-compose.yml (dev):
#   - Pulls images from GHCR instead of building locally
#   - NO local MongoDB (uses MongoDB Atlas M0 via MONGO_URI)
#   - NO frontend container (served by Azure Static Web Apps)
#   - NO hot-reload volume mounts
#   - Adds Nginx reverse proxy on port 80
#   - Memory limits set for B1s (1 GB RAM total)
#   - Prometheus + Grafana optional (comment in if you have a bigger VM)
# ─────────────────────────────────────────────

networks:
  city_net:
    driver: bridge

volumes:
  redis_data:
  influx_data:
  prometheus_data:
  grafana_data:

services:

  # ── 1. REDIS ─────────────────────────────────
  # Used for pub/sub between simulation→backend and rate limiting.
  # No Atlas equivalent — keep as container.

  redis:
    image: redis:7-alpine
    container_name: city_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - city_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 80M

  # ── 2. INFLUXDB ───────────────────────────────
  # Time-series storage for sensor readings.

  influxdb:
    image: influxdb:2.7
    container_name: city_influx
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASS:-citypass123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-smart_city_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-city_sensors}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - city_net
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── 3. SIMULATION ─────────────────────────────

  simulation:
    image: ghcr.io/crevan-neil/smart-city-simulation:latest
    container_name: city_simulation
    restart: unless-stopped
    environment:
      REDIS_URL: redis://city_redis:6379
      REDIS_CHANNEL: city:live
      SIM_INTERVAL_SEC: 2
      PYTHONUNBUFFERED: 1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - city_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 150M

  # ── 4. AI SERVICE ─────────────────────────────

  ai_service:
    image: ghcr.io/crevan-neil/smart-city-ai-service:latest
    container_name: city_ai
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}                    # → MongoDB Atlas M0
      REDIS_URL: redis://city_redis:6379
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-flash}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: '["${FRONTEND_URL:-https://your-app.azurestaticapps.net}"]'
      PYTHONUNBUFFERED: 1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - city_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 200M

  # ── 5. BACKEND ────────────────────────────────

  backend:
    image: ghcr.io/crevan-neil/smart-city-backend:latest
    container_name: city_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: ${MONGO_URI}                    # → MongoDB Atlas M0
      REDIS_URL: redis://city_redis:6379
      REDIS_CHANNEL: city:live
      INFLUX_URL: http://city_influx:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-smart_city_org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-city_sensors}
      CLIENT_ORIGIN: ${FRONTEND_URL:-https://your-app.azurestaticapps.net}
      SIM_URL: http://city_simulation:8000
      AI_SERVICE_URL: http://city_ai:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - city_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 200M

  # ── 6. NGINX (reverse proxy) ──────────────────
  # Exposes port 80 on the VM. Routes traffic to backend/ai/sim.
  # The React frontend is served from Azure Static Web Apps CDN.

  nginx:
    image: nginx:1.25-alpine
    container_name: city_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - city_net
    depends_on:
      - backend
      - ai_service
      - simulation
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 32M

  # ── 7. PROMETHEUS (optional — enable on B2s) ──
  # Comment this section back in if you upgrade to a B2s VM.
  # On a B1s (1 GB RAM), disable to save ~150 MB.

