# ─────────────────────────────────────────────
#  monitoring/alerts/smart_city.yml
#  Prometheus alerting rules for the Smart City
#  Digital Twin project
# ─────────────────────────────────────────────

groups:
  - name: smart_city_availability
    rules:
      # ── Any service is down ──────────────────
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: >
            The scrape target '{{ $labels.job }}' ({{ $labels.instance }})
            has been unreachable for more than 1 minute.

      # ── Simulation loop has stopped ──────────
      - alert: SimulationLoopStopped
        expr: simulation_loop_running == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Simulation loop is not running"
          description: >
            The simulation tick loop has not been active for 2 minutes.
            City data may be stale.

  - name: smart_city_performance
    rules:
      # ── High HTTP error rate ─────────────────
      - alert: HighErrorRate
        expr: >
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
          /
          sum(rate(http_requests_total[5m])) by (job)
          > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: >
            Service '{{ $labels.job }}' has a 5xx error rate above 1%
            for the last 5 minutes (current: {{ $value | humanizePercentage }}).

      # ── Slow requests (P95 latency) ──────────
      - alert: SlowRequests
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow P95 latency on {{ $labels.job }}"
          description: >
            The 95th percentile request latency for '{{ $labels.job }}'
            has exceeded 2 seconds for 5 minutes.

      # ── High LLM response time ───────────────
      - alert: SlowLLMResponse
        expr: >
          histogram_quantile(0.95,
            sum(rate(llm_response_duration_seconds_bucket[5m])) by (le)
          ) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM responses are slow"
          description: >
            The 95th percentile LLM response time has exceeded 10 seconds.
            Consider switching to a faster model or caching responses.
