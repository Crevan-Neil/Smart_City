# ─────────────────────────────────────────────
#  monitoring/prometheus.yml
#  Prometheus scrape configuration for the
#  Smart City Digital Twin
# ─────────────────────────────────────────────

global:
  scrape_interval:     15s   # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate alert rules
  scrape_timeout:      10s

# ── Alert rules ───────────────────────────────
rule_files:
  - /etc/prometheus/alerts/*.yml

# ── Alertmanager (optional — add when ready) ──
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── Scrape targets ────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Node.js backend — prom-client /metrics
  - job_name: backend
    static_configs:
      - targets: [city_backend:3001]
    metrics_path: /metrics

  # Python simulation service
  - job_name: simulation
    static_configs:
      - targets: [city_simulation:8000]
    metrics_path: /metrics

  # Python AI service
  - job_name: ai_service
    static_configs:
      - targets: [city_ai:8001]
    metrics_path: /metrics

  # MongoDB exporter (optional — disabled by default)
  # - job_name: mongodb
  #   static_configs:
  #     - targets: [mongodb_exporter:9216]

  # Redis exporter (optional — disabled by default)
  # - job_name: redis
  #   static_configs:
  #     - targets: [redis_exporter:9121]
