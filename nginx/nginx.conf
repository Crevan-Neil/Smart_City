# ─────────────────────────────────────────────
#  nginx/nginx.conf
#  VM-level Nginx reverse proxy.
#
#  Listens on port 80. Routes to microservices
#  running in Docker on the same host.
#
#  This is DIFFERENT from frontend/nginx.conf
#  which serves the React SPA inside Docker.
#  The React app is on Azure Static Web Apps.
# ─────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Timeouts (important for WebSocket + LLM SSE) ──
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;
    keepalive_timeout      65s;

    # ── Gzip ─────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ── Upstream definitions ──────────────────
    upstream backend {
        server city_backend:3001;
    }

    upstream ai_service {
        server city_ai:8001;
    }

    upstream simulation {
        server city_simulation:8000;
    }

    upstream frontend {
        server city_frontend:80;
    }

    # ── Main server block ─────────────────────
    server {
        listen 80;
        server_name _;     # Accept any hostname / IP

        # Max body size (for file uploads etc.)
        client_max_body_size 10M;

        # ── CORS headers ──
        # Allow the current request origin to support credentials
        set $cors_origin $http_origin;
        if ($cors_origin = "") {
            set $cors_origin "*";
        }

        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials true always;

        # Pre-flight OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── Health check (for Azure load balancer probes) ──
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── Backend REST API ──────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Socket.IO (WebSocket upgrade) ────
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            # Disable buffering for real-time events
            proxy_buffering off;
        }

        # ── Prometheus backend metrics ────────
        # Only reachable from inside the VM (not exposed in NSG)
        location /metrics {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            allow 127.0.0.1;
            deny all;
        }

        # ── AI Service ────────────────────────
        location /ai/ {
            proxy_pass http://ai_service/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Disable buffering for SSE streaming responses
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # ── Simulation Service ────────────────
        location /sim/ {
            proxy_pass http://simulation/;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Default: 404 ─────────────────────
        # The React SPA is on Azure Static Web Apps, NOT served here.
        # ── Frontend (React SPA) ──────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
